services:

  hr-db:
    image: postgres:16
    environment:
      POSTGRES_DB:       ${HR_DB_NAME}
      POSTGRES_USER:     ${HR_DB_USER}
      POSTGRES_PASSWORD: ${HR_DB_PASSWORD}
    volumes:
      - hr_db_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HR_DB_USER} -d ${HR_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  hr-app:
    build: .
    env_file: .env
    environment:
      HR_DB_HOST: hr-db      # nombre del servicio en la red interna
      CHROMA_DIR: /app/chroma_db
      USE_CHROMA: "1"
    volumes:
      - hr_chroma:/app/chroma_db
    depends_on:
      hr-db:
        condition: service_healthy
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=superset-stack_web"
      - "traefik.http.routers.hrcopilot.rule=Host(`${HR_DOMAIN}`)"
      - "traefik.http.routers.hrcopilot.entrypoints=websecure"
      - "traefik.http.routers.hrcopilot.tls.certresolver=myresolver"
      - "traefik.http.services.hrcopilot.loadbalancer.server.port=8051"
    restart: unless-stopped

volumes:
  hr_db_data:
  hr_chroma:

networks:
  # Red interna: solo app ↔ db
  internal:
  # Red externa: Traefik ya corre en superset-stack_web
  web:
    external: true
    name: superset-stack_web
